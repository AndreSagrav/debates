name: Supabase Keep-Alive

on:
  schedule:
    - cron: '0 */6 * * *'   # Cada 6 horas
  workflow_dispatch:

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Database (lectura + escritura)
        run: |
          ping_project () {
            NAME="$1"; BASE="$2"; KEY="$3"
            # Escritura (requiere keepalive_setup.sql en ese proyecto; si no, solo avisa)
            W=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$BASE/rest/v1/rpc/ping_keepalive" \
              -H "apikey: $KEY" -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" -d '{}' || echo "failed")
            # Lectura
            R=$(curl -s -o /dev/null -w "%{http_code}" -H "apikey: $KEY" -H "Authorization: Bearer $KEY" \
              "$BASE/rest/v1/debate_state?select=id&limit=1" || echo "failed")
            echo "$NAME -> escritura HTTP $W | lectura HTTP $R"
          }

          ping_project "Proyecto 1" "https://ksakdjvdqspzwjslzlnb.supabase.co" \
            "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtzYWtkanZkcXNwendqc2x6bG5iIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU4MzUzNjAsImV4cCI6MjEwMTQxMTM2MH0.vWm1Fto7FY8h12xspDgXjn1jOwYY8FzUEmWrP_DOmhA"

          ping_project "Proyecto 2" "https://hexrnglihkebatlshzmg.supabase.co" \
            "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhleHJuZ2xpaGtlYmF0bHNoem1nIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY5MDQ1NDMsImV4cCI6MjEwMjQ4MDU0M30.eyfDkc6pVhlkGeI88idWLiXX-hSwI5IST8rzZegbFro"
