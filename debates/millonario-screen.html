<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Millonario — Pantalla Pública</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💰</text></svg>">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="shared-games.css"/>
<style>
  body {
    background: #080314;
    background-image: 
      radial-gradient(circle at 50% 20%, rgba(139, 92, 246, 0.15) 0%, transparent 55%),
      radial-gradient(circle at 80% 80%, rgba(251, 191, 36, 0.08) 0%, transparent 50%);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    user-select: none;
  }

  .main-stage {
    display: grid;
    grid-template-columns: 1fr 320px;
    height: 100vh;
  }

  .stage-content {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px;
    position: relative;
  }

  /* Lifelines Container */
  .lifelines-row {
    display: flex;
    gap: 20px;
    margin-bottom: 40px;
  }

  .ll-pill {
    width: 60px;
    height: 60px;
    border-radius: 50%;
    background: linear-gradient(135deg, rgba(30, 20, 60, 0.9), rgba(15, 8, 35, 0.9));
    border: 2px solid var(--neon-gold);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    box-shadow: 0 0 25px rgba(251, 191, 36, 0.3);
    transition: all 0.3s;
  }

  .ll-pill.used {
    opacity: 0.18;
    filter: grayscale(1);
    border-color: rgba(255, 255, 255, 0.1);
    box-shadow: none;
  }

  /* Question & Options Area */
  .q-wrapper {
    width: 100%;
    max-width: 900px;
    display: flex;
    flex-direction: column;
    gap: 20px;
    align-items: center;
  }

  .q-diamond-card {
    width: 100%;
    background: linear-gradient(135deg, rgba(26, 16, 55, 0.95), rgba(14, 7, 32, 0.95));
    border: 2px solid rgba(139, 92, 246, 0.5);
    border-radius: 24px;
    padding: 36px 44px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8), 0 0 40px rgba(139, 92, 246, 0.2);
    position: relative;
  }

  .q-text-display {
    font-family: 'Outfit', sans-serif;
    font-size: clamp(22px, 3.2vw, 40px);
    font-weight: 700;
    line-height: 1.4;
    color: #fff;
  }

  /* Options Grid */
  .opts-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    width: 100%;
  }

  .opt-card {
    background: linear-gradient(135deg, rgba(20, 12, 45, 0.9), rgba(11, 5, 28, 0.9));
    border: 1.5px solid rgba(255, 255, 255, 0.1);
    border-radius: 18px;
    padding: 20px 28px;
    display: flex;
    align-items: center;
    gap: 16px;
    font-size: clamp(16px, 1.8vw, 22px);
    font-weight: 600;
    transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5);
  }

  .opt-card .lbl {
    font-family: 'JetBrains Mono', monospace;
    font-weight: 800;
    color: var(--neon-gold);
    font-size: 1.2em;
    text-shadow: 0 0 10px rgba(251, 191, 36, 0.4);
  }

  .opt-card.eliminated { opacity: 0.08; border-color: transparent; box-shadow: none; }

  .opt-card.correct {
    background: linear-gradient(135deg, rgba(16, 185, 129, 0.3), rgba(16, 185, 129, 0.1));
    border-color: var(--neon-emerald);
    color: #fff;
    box-shadow: 0 0 40px rgba(16, 185, 129, 0.5);
    animation: correctGlow 0.8s infinite alternate;
  }
  @keyframes correctGlow {
    from { box-shadow: 0 0 20px rgba(16, 185, 129, 0.3); }
    to   { box-shadow: 0 0 50px rgba(16, 185, 129, 0.8); }
  }

  /* Prize Ladder Sidebar */
  .ladder-sidebar {
    background: rgba(10, 4, 24, 0.95);
    backdrop-filter: blur(20px);
    border-left: 1px solid var(--border-glass);
    padding: 30px 20px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 6px;
  }

  .ladder-node {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 16px;
    border-radius: 12px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    font-weight: 700;
    color: var(--neon-gold);
    opacity: 0.4;
    transition: all 0.3s;
  }

  .ladder-node.safe { color: #fff; opacity: 0.8; font-weight: 800; }
  .ladder-node.active {
    opacity: 1;
    background: linear-gradient(90deg, rgba(251, 191, 36, 0.25), transparent);
    border-left: 4px solid var(--neon-gold);
    font-size: 15px;
    text-shadow: 0 0 15px rgba(251, 191, 36, 0.6);
  }
  .ladder-node.done { opacity: 0.2; color: var(--text-muted); }

  .fs-btn {
    position: fixed;
    bottom: 16px;
    right: 16px;
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid var(--border-glass);
    border-radius: 12px;
    padding: 10px 14px;
    cursor: pointer;
    color: #fff;
    font-size: 16px;
    z-index: 2000;
    transition: all 0.2s;
  }
  .fs-btn:hover { background: rgba(255, 255, 255, 0.2); }
</style>
</head>
<body>

<div class="main-stage">
  <div class="stage-content">
    
    <!-- Lifelines -->
    <div class="lifelines-row">
      <div class="ll-pill" id="badgeFifty" title="50:50">50:50</div>
      <div class="ll-pill" id="badgeVote" title="Voto Clase">📱</div>
      <div class="ll-pill" id="badgeHint" title="Pista Tutor">👨‍🏫</div>
    </div>

    <!-- Question Box -->
    <div class="q-wrapper">
      <div class="q-diamond-card">
        <div class="q-text-display" id="qText">Esperando inicio de la partida...</div>
      </div>

      <div class="opts-grid" id="optsGrid">
        <div class="opt-card" id="opt0"><span class="lbl">A:</span> <span class="val">—</span></div>
        <div class="opt-card" id="opt1"><span class="lbl">B:</span> <span class="val">—</span></div>
        <div class="opt-card" id="opt2"><span class="lbl">C:</span> <span class="val">—</span></div>
        <div class="opt-card" id="opt3"><span class="lbl">D:</span> <span class="val">—</span></div>
      </div>
    </div>
  </div>

  <!-- Prize Ladder Sidebar -->
  <div class="ladder-sidebar" id="ladderPanel"></div>
</div>

<button class="fs-btn" id="fsBtn" title="Pantalla completa">⤢</button>

<script src="shared-games.js"></script>
<script>
var PRIZES = ['₡1,000','₡2,000','₡3,000','₡5,000','₡10,000','₡20,000','₡40,000','₡80,000','₡160,000','₡320,000','₡640,000','₡1,250,000','₡2,500,000','₡5,000,000','₡10,000,000'];
var SAFE = [4, 9, 14];

function getPIN(){ return new URLSearchParams(window.location.search).get('pin'); }

function renderLadder(currentIdx){
  var panel = document.getElementById('ladderPanel'); panel.innerHTML = '';
  for(var i = 14; i >= 0; i--){
    var node = document.createElement('div');
    var isSafe = SAFE.indexOf(i) >= 0;
    node.className = 'ladder-node' + (i === currentIdx ? ' active' : i < currentIdx ? ' done' : '') + (isSafe ? ' safe' : '');
    node.innerHTML = '<span>'+(i+1)+' • '+PRIZES[i]+'</span>' + (isSafe ? '<span>⭐</span>' : '');
    panel.appendChild(node);
  }
}

function updateScreen(session){
  if(!session) return;
  var qIdx = session.current_level || 0;
  renderLadder(qIdx);

  var ll = session.lifelines || {};
  document.getElementById('badgeFifty').className = 'll-pill' + (ll.fifty ? '' : ' used');
  document.getElementById('badgeVote').className = 'll-pill' + (ll.vote ? '' : ' used');
  document.getElementById('badgeHint').className = 'll-pill' + (ll.hint ? '' : ' used');

  var qList = session.questions || [];
  var curQ = qList[qIdx];

  if(curQ && curQ.q && session.status === 'playing'){
    document.getElementById('qText').textContent = curQ.q;
    for(var i=0; i<4; i++){
      var card = document.getElementById('opt' + i);
      card.querySelector('.val').textContent = curQ.options[i] || '—';
      card.className = 'opt-card';
      
      if(session.eliminated && session.eliminated.indexOf(i) >= 0){
        card.classList.add('eliminated');
      }
      if(session.showAnswer && i === curQ.correct){
        card.classList.add('correct');
      }
    }
  } else {
    document.getElementById('qText').textContent = session.status === 'finished' ? '¡JUEGO FINALIZADO!' : 'Esperando al profesor...';
  }
}

function connect(){
  var pin = getPIN(); if(!pin) return;
  var client = GameEngine.getClient(); if(!client) return;

  client.from('millonario_sessions').select('*').eq('pin', pin).single().then(function(res){
    if(res.data){
      updateScreen(res.data);
      GameEngine.subscribe('millonario_sessions', res.data.id, function(updated){ updateScreen(updated); });
    }
  });
}

document.getElementById('fsBtn').addEventListener('click', function(){
  if(!document.fullscreenElement) document.documentElement.requestFullscreen().catch(function(){});
  else document.exitFullscreen();
});

renderLadder(-1);
connect();
</script>
</body>
</html>
